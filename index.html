<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JanSahay AI | Smart Scheme Finder</title>
    <style>
        /* Advanced CSS with Animations */
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%); 
            min-height: 100vh; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        
        .container { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.15); 
            max-width: 650px; 
            width: 95%; 
            text-align: center; 
            animation: slideIn 0.8s cubic-bezier(0.25, 0.8, 0.25, 1); 
        }
        
        h1 { color: #2c3e50; margin-bottom: 5px; font-size: 2.5rem; }
        h1 span { color: #e74c3c; }
        p.subtitle { color: #7f8c8d; font-size: 1.1rem; margin-bottom: 30px; }
        
        .search-area { display: flex; gap: 15px; margin-bottom: 25px; }
        
        input { 
            flex: 1; 
            padding: 18px 20px; 
            font-size: 16px; 
            border: 2px solid #e0e6ed; 
            border-radius: 12px; 
            outline: none; 
            transition: all 0.3s ease; 
        }
        input:focus { border-color: #3498db; box-shadow: 0 0 0 4px rgba(52, 152, 219, 0.15); }
        
        .mic-btn { 
            padding: 0 20px; 
            font-size: 24px; 
            cursor: pointer; 
            background: #ff4757; 
            color: white; 
            border: none; 
            border-radius: 12px; 
            transition: all 0.3s ease; 
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .mic-btn:hover { background: #ff6b81; transform: translateY(-2px); }
        .mic-btn.listening { 
            animation: pulse 1.5s infinite; 
            background: #2ed573; 
        }
        
        .search-btn { 
            width: 100%; 
            padding: 16px; 
            font-size: 18px; 
            cursor: pointer; 
            background: #1e90ff; 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-weight: 600; 
            letter-spacing: 1px; 
            transition: all 0.3s ease; 
        }
        .search-btn:hover { background: #3742fa; transform: translateY(-2px); box-shadow: 0 8px 15px rgba(30, 144, 255, 0.3); }
        
        /* Loader Animation */
        .loader-container { display: none; margin-top: 30px; }
        .loader { 
            border: 4px solid #f3f3f3; 
            border-top: 4px solid #1e90ff; 
            border-radius: 50%; 
            width: 45px; 
            height: 45px; 
            animation: spin 1s linear infinite; 
            margin: 0 auto 15px auto; 
        }
        .loader-text { color: #576574; font-weight: 500; }

        /* Result Card Animation */
        #result { 
            margin-top: 30px; 
            text-align: left; 
            padding: 25px; 
            background: #f1f2f6; 
            border-radius: 15px; 
            border-left: 6px solid #2ed573; 
            display: none; 
            opacity: 0; 
            transform: translateY(20px); 
        }
        #result.show { 
            display: block;
            animation: fadeInUp 0.5s forwards; 
        }
        
        .scheme-title { color: #2f3542; margin-top: 0; font-size: 1.5rem; }
        .ai-score { display: inline-block; background: #eccc68; color: #2f3542; padding: 5px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; margin-bottom: 15px; }
        
        /* Keyframes */
        @keyframes slideIn { 
            from { opacity: 0; transform: translateY(-40px) scale(0.95); } 
            to { opacity: 1; transform: translateY(0) scale(1); } 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 
            0% { box-shadow: 0 0 0 0 rgba(46, 213, 115, 0.7); } 
            70% { box-shadow: 0 0 0 15px rgba(46, 213, 115, 0); } 
            100% { box-shadow: 0 0 0 0 rgba(46, 213, 115, 0); } 
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>JanSahay AI <span>🇮🇳</span></h1>
        <p class="subtitle">Bol kar ya likh kar sarkari scheme dhoondhein.</p>
        
        <div class="search-area">
            <input type="text" id="searchBox" placeholder="Jaise: Kheti ke liye loan chahiye...">
            <button class="mic-btn" id="micBtn" onclick="startVoice()" title="Bolne ke liye dabayein">🎤</button>
        </div>
        
        <button class="search-btn" onclick="searchScheme()">Khojein (Search)</button>
        
        <!-- Loading Animation -->
        <div class="loader-container" id="loader">
            <div class="loader"></div>
            <div class="loader-text">AI dhoondh raha hai...</div>
        </div>

        <!-- Result Box -->
        <div id="result"></div>
    </div>

    <script>
        function startVoice() {
            if (!('webkitSpeechRecognition' in window)) {
                alert("Bhai, tera browser voice search support nahi karta. Please Google Chrome use kar!");
                return;
            }

            let recognition = new webkitSpeechRecognition();
            recognition.lang = 'hi-IN'; 
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            let searchInput = document.getElementById("searchBox");
            let micBtn = document.getElementById("micBtn");
            
            searchInput.placeholder = "Suno raha hoon, bol bhai...";
            micBtn.classList.add("listening"); // Pulse animation on karega

            recognition.start();

            recognition.onresult = function(event) {
                let transcript = event.results[0][0].transcript;
                searchInput.value = transcript;
                searchInput.placeholder = "Jaise: Kheti ke liye loan chahiye...";
                micBtn.classList.remove("listening");
                searchScheme(); 
            };

            recognition.onerror = function(event) {
                alert("Awaaz samajh nahi aayi, ek baar wapas mic daba kar bol.");
                searchInput.placeholder = "Jaise: Kheti ke liye loan chahiye...";
                micBtn.classList.remove("listening");
            };
            
            recognition.onend = function() {
                micBtn.classList.remove("listening");
            }
        }

        async function searchScheme() {
            let query = document.getElementById("searchBox").value;
            let resultDiv = document.getElementById("result");
            let loader = document.getElementById("loader");
            
            if(!query) {
                alert("Bhai, pehle kuch likh ya bol toh de!");
                return;
            }

            // Purana result chhupao aur loader dikhao
            resultDiv.classList.remove("show");
            resultDiv.style.display = "none";
            loader.style.display = "block";

            try {
                // YAHAN MAINE TERA NAYA RENDER LINK DAAL DIYA HAI 👇
                let response = await fetch("https://jansahay-ai-qelw.onrender.com/search?query=" + query);
                let data = await response.json();

                // Loader chhupao
                loader.style.display = "none";

                if(data.best_scheme) {
                    resultDiv.innerHTML = `
                        <div class="ai-score">⚡ AI Match Score: ${data.match_score}</div>
                        <h3 class="scheme-title">${data.best_scheme.name}</h3>
                        <p style="color: #576574; line-height: 1.6;"><b>📌 Kya hai:</b> ${data.best_scheme.description}</p>
                        <p style="color: #576574; line-height: 1.6;"><b>🎯 Kiske liye hai:</b> ${data.best_scheme.eligibility}</p>
                    `;
                    resultDiv.classList.add("show");
                } else {
                    resultDiv.innerHTML = `<p style="color: #ff4757; font-weight: bold;">${data.message}</p>`;
                    resultDiv.classList.add("show");
                }
            } catch (error) {
                loader.style.display = "none";
                resultDiv.innerHTML = `<p style="color: #ff4757; font-weight: bold;">Backend se connect nahi ho paya. Ek baar check kar internet chal raha hai ya nahi.</p>`;
                resultDiv.classList.add("show");
            }
        }
    </script>

</body>
</html>
